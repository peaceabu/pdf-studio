name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Finds the folder that contains package.json, wherever it is in the repo
      - name: Locate the app folder
        run: |
          PKG=$(find . -name package.json -not -path "*/node_modules/*" | awk '{ print length, $0 }' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$PKG" ]; then
            echo "::error::No package.json found in this repository. Files in the repo:"
            find . -maxdepth 3 -not -path "./.git*" | head -100
            exit 1
          fi
          APP_DIR=$(dirname "$PKG")
          echo "App folder: $APP_DIR"
          echo "APP_DIR=$GITHUB_WORKSPACE/$APP_DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install JS dependencies
        run: cd "$APP_DIR" && npm install

      - name: Align native module versions with the Expo SDK
        run: cd "$APP_DIR" && npx expo install --fix

      - name: Generate native Android project
        run: cd "$APP_DIR" && npx expo prebuild --platform android --clean --no-install
        env:
          CI: 1

      - name: Build release APK
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/apk-out/PDF-Studio.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio-apk
          path: apk-out/PDF-Studio.apk
